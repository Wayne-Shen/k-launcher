function sceneBanner(){if(S.scene==='offline')return note('当前处于离线状态','本地实例与日志仍可查看。在线目录展示上次缓存，新的下载将等待网络。','warn');if(S.scene==='expired')return note('Microsoft 登录已失效','下载可继续；启动游戏前请到账号页重新登录。','warn');return ''}
function render(){route=location.hash.slice(1)||document.body.dataset.entry||'home';if(!names[route])route='home';document.title=`${names[route]} · K Launcher设计原型`;$$('.nav').forEach(n=>{let yes=n.dataset.route===(route==='instance'?'instances':route);n.classList.toggle('active',yes);yes?n.setAttribute('aria-current','page'):n.removeAttribute('aria-current')});$('#breadcrumb').textContent=route==='instance'?'实例库 / '+S.instance:'工作台 / '+names[route];$('#account-side').textContent=S.accountRemoved?'尚未登录':S.scene==='expired'?'需要重新登录':'已验证 · Microsoft';$('#task-count').textContent=S.tasks.filter(t=>!['已取消','已完成'].includes(t.state)).length;$('#main').innerHTML=sceneBanner()+pages[route]()+`<footer class="footnote"><span>设计 2.0 · 静态演示</span><span>演示数据　·　${route==='install'?'目录快照 2026.10.22':'无真实系统操作'}　·　<a href="visual-spec.html">查看视觉规范 ↗</a></span></footer>`;bindPage()}
function empty(title,desc,btn,action,icon='grid'){return `<div class="card empty"><div class="miniicon">${I(icon)}</div><h2>${title}</h2><p>${desc}</p>${B(btn,action,'primary','plus')}</div>`}
function instanceCard(name,version,loader,amber=false){return `<article class="card"><div class="terrainthumb ${amber?'amber':''}">${art()}</div><div class="instancebody"><div class="instance-tile">${I("cube")}</div><div class="row between"><h3>${name}</h3>${badge('就绪')}</div><div class="tinylabels">${badge(version,'neutral')}${badge(loader,'neutral')}</div><p>上次游玩：${amber?'昨天 21:16':'今天 08:42'} · ${loader==='Fabric'?'4 个 Mod':'无 Mod 样例'}</p><div class="row between" style="margin-top:14px"><button class="textlink" onclick="selectInstance('${name}')">管理实例 ${I('arrow')}</button>${B('启动',`launch('${name}')`,'sm','play')}</div></div></article>`}

function recentRow(n,v,l,last){return `<div class="recent-row"><div class="miniicon">${I('cube')}</div><div class="grow"><h3>${n}</h3><p>${v} · ${l} <span style="padding-left:12px">${last}</span></p></div>${B('管理',`selectInstance('${n}')`,'ghost sm','arrow')}</div>`}
function homeTask(){const t=S.tasks.find(t=>!['已完成','已取消'].includes(t.state));if(!t)return `<div class="card pad home-download"><h3>队列已完成</h3><p class="subtext">可以继续游玩，或安装另一个版本。</p>${B('查看记录',"S.taskTab='done';go('tasks')",'ghost')}</div>`;const state=S.scene==='offline'?'等待网络':S.scene==='error'?'需要处理':t.state;return `<div class="card pad home-download"><div class="row between"><h3>${esc(t.name)}</h3></div><p class="subtext">${state}</p><div class="metric-inline"><span class="percent">${t.percent}<small>%</small></span><span>${state==='下载中'?t.speed:'—'}</span></div><div class="bar"><i style="width:${t.percent}%"></i></div><p class="subtext">${t.meta}</p>${B(state==='需要处理'?'查看并恢复':'管理下载',"go('tasks')",'ghost full','arrow')}</div>`}
function contextSelector(){return `<div class="context-strip"><span class="muted">目标实例</span><select class="input" aria-label="Mod目标实例" onchange="chooseInstance(this.value);render()">${['远山生存','原版漫游','轻量探索'].map(n=>`<option ${S.instance===n?'selected':''}>${n}</option>`).join('')}</select><span>${S.instanceVersion} · ${S.instanceLoader}</span><span class="muted" style="margin-left:auto">内容按实例隔离</span></div>`}
function restoreBackupModal(){modal('从备份恢复为新实例',`<div class="kv"><span>备份示例</span><span>远山生存 · 2026-10-21</span></div><div class="kv"><span>包含内容</span><span>存档、Mod、配置与锁定清单</span></div><div class="kv"><span>新实例</span><span>远山生存 - 恢复副本</span></div>${note('先校验，再恢复','完整文件摘要通过后写入新UUID目录。损坏备份会阻断；当前实例保留。')}`,B('返回','closeModal()')+B('模拟创建恢复任务',"queueMod('恢复备份为新实例')",'primary'))}
function trashModal(){modal('实例回收站',`<div class="listrow"><div class="miniicon">${I('cube')}</div><div class="grow"><h3>旧版测试</h3><p>10月20日删除 · 含1个存档 · 1.2 GiB</p></div></div><p class="subtext">最低保留7天；到期后也不会自动删除存档。</p>`,B('关闭','closeModal()')+B('预览恢复','restoreTrashPreview()','primary')+B('永久清理预览','purgeTrashPreview()','danger'))}
function restoreTrashPreview(){modal('恢复前审计',note('将恢复为独立实例','检查锁文件、组件与存档摘要后恢复；不完整则进入需要修复。'),B('返回','trashModal()')+B('模拟恢复',"queueMod('恢复回收站实例')",'primary'))}
function purgeTrashPreview(){modal('永久清理预览',note('此示例仍在7天保留期内','包含1个存档，当前不允许永久清理。到期后也需确认范围并输入“永久删除”，不会自动销毁存档。','warn'),B('返回回收站','trashModal()'))}

function exitPreview(){modal('退出启动器',`<p>有 ${S.tasks.filter(t=>!['已完成','已取消'].includes(t.state)).length} 项未完成任务。</p>${note('保存进度后退出','正在提交安装结果时需要等到保存结束。游戏默认继续运行，日志跟踪可能中断。')}`,B('返回','closeModal()')+B('模拟安全退出',"closeModal();toast('已演示安全退出流程；页面继续用于审阅')",'primary'))}

const pages={
home:()=>head('首页','选择一个实例，继续游戏。',B('安装游戏',"go('install')",'','plus'))+(S.scene==='empty'?empty('从第一个实例开始','选择 Minecraft 版本，下载并建立独立的游戏目录。','安装游戏',"go('install')"):`<section class="hero">${art()}<div class="herocopy"><div class="eyebrow">CONTINUE PLAYING</div><h2>${esc(S.instance)}</h2><p>Minecraft ${S.instanceVersion} <span style="padding:0 6px">/</span> ${S.instanceLoader} <span style="padding:0 6px">/</span> ${javaFor(S.instanceVersion)}</p><div class="row" style="margin-bottom:24px"><span class="hero-status">${S.running?'游戏运行中':S.scene==='error'?'需要修复':S.scene==='expired'||S.accountRemoved?'需要登录':'已准备就绪'}</span><span class="muted" style="font-size:12px">· 上次游玩 今天 08:42</span></div><div class="row">${B(S.running?'运行状态':'启动游戏',`launch(${JSON.stringify(S.instance)})`,'primary large','play')}${B('管理实例',"go('instance')",'secondary','arrow')}</div><small>账号 ${S.accountRemoved?'未登录':S.scene==='expired'?'需重新验证':'Wayne'}　·　4 GiB 内存　·　独立存档</small></div></section><div class="homegrid"><section><div class="sectiontitle"><h2>最近使用</h2><a class="textlink" href="#instances">全部实例 ${I('arrow')}</a></div><div class="card recent-list">${recentRow('远山生存','1.21.1','Fabric','今天 08:42')}${recentRow('原版漫游','26.1','原版','昨天 21:16')}${recentRow('轻量探索','1.20.1','Forge','10月19日')}</div><a class="quiet-link" href="#instances" onclick="event.preventDefault();importModal()">${I('folder')}<span>从 PCL 或现有目录导入</span><span class="muted">复制并保留原目录 ${I('arrow')}</span></a></section><aside class="rightstack"><div class="sectiontitle"><h2>下载动态</h2><a class="textlink" href="#tasks">查看全部</a></div>${homeTask()}<div class="design-note">本地管理，无自动上传。<br>每个实例独立保存配置与存档。</div></aside></div>`),
instances:()=>head('实例库','不同版本，独立世界。每个实例单独保存 Mod、配置与存档。',B('导入实例','importModal()','','folder')+B('新建实例',"go('install')",'primary','plus'))+`<div class="modtoolbar"><div class="searchbox">${I('search')}<input class="input" id="instance-search" placeholder="搜索名称、版本或 Loader" aria-label="搜索实例"></div><span class="badge neutral">全部实例 · 3</span></div><div id="instance-grid" class="three">${S.scene==='empty'?'':instanceCard('远山生存','1.21.1','Fabric')+instanceCard('原版漫游','26.1','原版',true)+instanceCard('轻量探索','1.20.1','Forge')}</div><div id="instance-empty" class="${S.scene==='empty'?'':'hide'}">${empty('暂时没有找到实例','清除筛选，或安装一个新的游戏实例。','安装游戏',"go('install')")}</div>`,
install:()=>head('安装游戏','选择游戏版本与组件，创建一个干净、独立的实例。',B('导入整合包','importModal()','','folder'))+`<div class="stepline"><span class="stepnum">1</span><strong style="color:var(--green)">选择版本</strong><hr><span class="stepnum" style="background:var(--line);color:var(--muted)">2</span>组件与配置<hr><span class="stepnum" style="background:var(--line);color:var(--muted)">3</span>确认安装计划</div>${S.scene==='error'?note('目标磁盘空间不足','此示例需要至少 2.4 GiB。请释放空间或更换目录后重新预检。DISK_SPACE_LOW','bad'):''}<div class="installgrid"><div><section class="card pad"><div class="row between"><h2><span class="step-label">01</span>游戏版本</h2><span class="subtext">官方目录 · 缓存于今天 08:58</span></div><div class="tabs" style="margin-top:20px"><button class="tab ${S.channel==='release'?'selected':''}" onclick="setChannel('release')">正式版</button><button class="tab ${S.channel==='snapshot'?'selected':''}" onclick="setChannel('snapshot')">快照与实验</button><button class="tab ${S.channel==='old'?'selected':''}" onclick="setChannel('old')">历史版本</button></div><div class="searchbox">${I('search')}<input class="input" id="version-search" aria-label="搜索游戏版本" placeholder="搜索版本，例如 1.21.1"></div><div id="versions">${versionList()}</div></section><section class="card pad" style="margin-top:18px"><div class="row between"><h2><span class="step-label">02</span>组件与实例</h2><span class="subtext">每个实例使用一套组件</span></div><div class="loadergrid">${['原版','Fabric','Forge','NeoForge'].map(l=>`<button class="loader ${S.loader===l?'selected':''}" onclick="setLoader('${l}')"><strong>${l}</strong><span class="muted">${l==='原版'?'纯净体验':'按版本查询'}</span></button>`).join('')}</div><div class="grid2 compact-fields"><div><label class="label" for="loader-build">${S.loader==='原版'?'组件状态':'Loader 构建'}</label><select class="input" id="loader-build" ${S.loader==='原版'?'disabled':''}><option>${S.loader==='原版'?'无需额外组件':S.loader==='Fabric'?'0.16.14（演示）':S.loader==='Forge'?'47.4.x（演示）':'21.1.x（演示）'}</option></select><p class="subtext">${S.loader==='原版'?'纯净的 Minecraft 体验':'构建仅作示例，实际需验证兼容'}</p></div><div><label class="label" for="instance-name">实例名称</label><input id="instance-name" class="input" maxlength="64" value="${esc(S.name)}"><div class="subtext" id="name-error">1–64 个字符，可随时修改。</div></div></div></section></div><aside class="card pad summary"><div class="row between"><h2>安装摘要</h2>${badge('预览')}</div><dl><dt>实例</dt><dd id="sum-name">${esc(S.name)}</dd><dt>Minecraft</dt><dd id="sum-version">${S.version}</dd><dt>组件</dt><dd id="sum-loader">${S.loader}</dd><dt>Java</dt><dd id="sum-java">${javaFor(S.version)} · 自动匹配</dd><dt>目标目录</dt><dd class="mono">D:\\Games\\KLauncher</dd></dl><div class="divider"></div><small class="muted">预计新增下载（示例）</small><div class="statbig">668 <small class="muted">MiB</small></div><div class="kv"><span>缓存复用</span><span>186 MiB</span></div><div class="kv"><span>安装预留空间</span><span>2.4 GiB</span></div><div class="kv"><span>当前可用</span><span>${S.scene==='error'?'1.1':'221.6'} GiB</span></div><div class="notice" style="margin:17px 0;font-size:11px">${I('check')}<span>安装后自动校验完整性，完成后即可启动。</span></div>${B('预览安装计划','confirmInstall()','primary full','download')}<p class="subtext" style="text-align:center;margin-top:10px">设计演示 · 不会实际下载</p></aside></div>`,
instance:()=>head('实例详情','实例库 / '+S.instance,B('打开目录','folderModal()','','folder')+B('更多操作','instanceActions()','','grid'))+`<section class="card instancebanner"><div class="instanceicon">${art()}</div><div><div class="row"><h2>${esc(S.instance)}</h2>${badge(S.running?'运行中':S.scene==='error'?'需要修复':'就绪',S.scene==='error'?'bad':'')}</div><div class="tinylabels">${badge('Minecraft '+S.instanceVersion,'neutral')}${badge(S.instanceLoader+' · 固定构建','neutral')}${badge(S.instanceMods+' 个 Mod','neutral')}</div><p class="subtext">独立游戏目录 · 上次游玩 今天 08:42</p></div><div class="rowactions">${B('校验与修复','repairModal()','','refresh')}${B(S.running?'运行状态':'启动游戏',`launch(${JSON.stringify(S.instance)})`,'primary','play')}</div></section><div class="tabs"><button class="tab selected">概览</button><button class="tab" onclick="go('mods')">Mod 管理</button><button class="tab" onclick="instanceParams()">启动参数</button><button class="tab" onclick="go('logs')">运行日志</button></div>${S.scene==='error'?note('发现 2 个必需依赖文件缺失','当前实例尚不能启动。生成修复计划后可重新下载缺失内容；存档不会被修改。','bad'):''}<div class="grid2"><section class="card pad"><div class="row between"><h2>组件与运行环境</h2><button class="textlink" onclick="upgradeModal()">克隆并升级 →</button></div><div class="kv"><span>Minecraft</span><strong>${S.instanceVersion}</strong></div><div class="kv"><span>主 Loader</span><span>${S.instanceLoader} · 已锁定版本</span></div><div class="kv"><span>Java 运行时</span><span>${javaFor(S.instanceVersion)} · Windows x64</span></div><div class="kv"><span>内存分配</span><span>4 GiB <span class="muted">/ 实例覆盖</span></span></div><div class="kv"><span>游戏窗口</span><span>1280 × 720</span></div><div class="kv"><span>资源校验</span><span class="row">${I('check')}今天 08:40</span></div></section><section class="card pad"><div class="row between"><h2>本地内容</h2>${badge('独立保存')}</div><div class="listrow" style="padding-left:0;padding-right:0"><div class="miniicon">${I('cube')}</div><div class="grow"><h3>${S.instanceMods} 个 Mod</h3><p>1 个可更新 · ${S.mods.filter(m=>!m.enabled).length} 个已禁用</p></div>${B('管理',"go('mods')",'sm')}</div><div class="listrow" style="padding-left:0;padding-right:0"><div class="miniicon">${I('folder')}</div><div class="grow"><h3>3 个本地存档</h3><p>完整备份需要先关闭游戏</p></div>${B('备份','backupModal()','sm')}</div><div class="listrow" style="padding-left:0;padding-right:0"><div class="miniicon">${I('log')}</div><div class="grow"><h3>最近运行正常结束</h3><p>本地日志 · 退出码 0</p></div>${B('查看',"go('logs')",'sm')}</div></section></div><section class="card pad" style="margin-top:18px"><div class="row between"><div><h3>让版本变更可回退</h3><p class="subtext">升级会先创建一个克隆实例，并展示 Mod 兼容差异。现有存档建议另外备份。</p></div>${B('查看升级计划','upgradeModal()','','arrow')}</div></section>`,
mods:()=>head('Mod 管理','管理当前实例的内容与依赖。',B('本地添加','localModModal()','','folder')+B('检查更新','modUpdate()','','refresh'))+contextSelector()+`<div class="tabs"><button class="tab ${S.modTab==='installed'?'selected':''}" onclick="setModTab('installed')">已安装 <span class="muted">${S.instanceLoader==='Fabric'?S.mods.length:0}</span></button><button class="tab ${S.modTab==='discover'?'selected':''}" onclick="setModTab('discover')">发现 Mod</button><button class="tab ${S.modTab==='packs'?'selected':''}" onclick="setModTab('packs')">资源与光影</button></div><div class="modtoolbar"><div class="searchbox">${I('search')}<input class="input" id="mod-search" placeholder="${S.modTab==='installed'?'搜索已安装 Mod':'搜索 Modrinth 项目'}" aria-label="搜索Mod" value="${esc(S.modFilter)}"></div>${badge(S.instanceVersion,'neutral')}${badge(S.instanceLoader,'neutral')}${badge('客户端','neutral')}<span class="muted" style="font-size:11px;margin-left:auto">${S.modTab==='installed'?'本地文件与锁定清单':'Modrinth · 版本级兼容筛选'}</span></div><div id="mod-content">${modContent()}</div><p class="subtext" style="margin-top:16px">兼容检查依赖公开元数据，无法保证所有 Mod 的运行期行为；未知文件保留并单独标记。</p>`,
tasks:()=>head('下载任务','下载、校验与安装各自可见。安全保存进度后，可在下次继续。',B('全部暂停','pauseAll()','','pause'))+`<div class="metricgrid"><section class="card metric"><small>当前下载速度（示例）</small><strong>${taskSpeed()} <small>MiB/s</small></strong></section><section class="card metric"><small>活动任务</small><strong>${S.tasks.filter(t=>!['已完成','已取消'].includes(t.state)).length}</strong></section><section class="card metric"><small>本次缓存复用</small><strong>186 <small>MiB</small></strong></section><section class="card metric"><small>数据来源</small><strong style="font-size:17px;margin-top:14px">官方源</strong></section></div><div class="tabs"><button class="tab ${S.taskTab==='active'?'selected':''}" onclick="setTaskTab('active')">活动任务</button><button class="tab ${S.taskTab==='attention'?'selected':''}" onclick="setTaskTab('attention')">需要处理</button><button class="tab ${S.taskTab==='done'?'selected':''}" onclick="setTaskTab('done')">已完成</button></div><div id="task-list">${taskList()}</div><div class="notice">${I('info')}<div><strong>下载完成后还会校验与安装</strong><p>正在提交安装结果时，暂停与取消将暂时不可用。关闭启动器前会保存可恢复进度。</p></div></div>`,

function taskSpeed(){if(['offline','error'].includes(S.scene))return '0';return S.tasks.filter(t=>t.state==='下载中').reduce((v,t)=>v+(parseFloat(t.speed)||0),0).toFixed(1)}function taskList(){let ts=S.tasks.map(t=>S.scene==='error'&&t.id===1?{...t,state:'需要处理',error:true}:S.scene==='offline'&&t.state==='下载中'?{...t,state:'等待网络'}:t).filter(t=>S.taskTab==='attention'?t.error:S.taskTab==='done'?['已完成','已取消'].includes(t.state):!['已完成','已取消'].includes(t.state));if(S.scene==='empty'||!ts.length)return empty(S.taskTab==='done'?'暂无完成记录':S.taskTab==='attention'?'没有需要处理的任务':'队列很安静','任务将在这里展示进度、校验阶段与恢复操作。','安装游戏',"go('install')",'task');return ts.map(t=>`<article class="card task"><div class="taskhead"><div class="miniicon">${I(t.error?'info':'download')}</div><div class="grow"><div class="row"><h3>${esc(t.name)}</h3>${badge(t.error?'需要处理':t.state,t.error?'bad':t.state==='已暂停'?'neutral':'')}</div><p class="subtext">${t.kind} · ${t.error?'文件摘要不匹配 / HASH_MISMATCH':t.stage}</p></div>${['已完成','已取消'].includes(t.state)?B('查看记录',`taskDetails(${t.id})`,'sm'):B(t.error?'重试失败项':t.state==='下载中'?'暂停':'继续',`taskControl(${t.id},'toggle')`,'sm',t.error?'refresh':t.state==='下载中'?'pause':'play')}${!['已完成','已取消'].includes(t.state)?B('取消',`cancelTask(${t.id})`,'ghost sm'):''}</div><div class="bar"><i style="width:${t.percent}%;background:${t.error?'var(--red)':'var(--green)'}"></i></div><div class="taskmeta"><span>${t.meta} · ${t.percent}% 已传输（示例）</span><span>${t.state==='下载中'?t.speed:'—'}　·　${t.error?'文件已隔离，未写入实例':'来源：官方源'}</span></div>${t.error?`<div class="notice bad" style="margin:15px 0 0">${I('info')}<div>一个资源文件未通过摘要校验。旧实例保持完整。<button class="textlink" onclick="taskDetails(${t.id})" style="margin-left:10px;color:inherit">查看错误详情 →</button></div></div>`:`<div class="substeps"><span>✓ 元数据已固定</span><span>${t.percent===100?'✓':'◌'} 下载资源</span><span>○ 校验与构建</span><button class="textlink" onclick="taskDetails(${t.id})">步骤详情 →</button>${t.state==='下载中'?'<button class="review-action" onclick="completeT function bindPage(){$$('.loader,.versionline,.tab,.settingnav button').forEach(e=>e.setAttribute('aria-pressed',String(e.classList.contains('selected'))));if($('#instance-search'))$('#instance-search').oninput=e=>{let n=0;$$('#instance-grid article').forEach(c=>{let yes=c.textContent.toLowerCase().includes(e.target.value.toLowerCase());c.classList.toggle('hide',!yes);n+=yes});$('#instance-empty').classList.toggle('hide',n>0)};if($('#version-search'))$('#version-search').oninput=e=>{let n=0;$$('[data-version]').forEach(c=>{let yes=c.dataset.version.includes(e.target.value);c.classList.toggle('hide',!yes);n+=yes});$('#version-empty').classList.toggle('hide',n>0)};if($('#instance-name'))$('#instance-name').oninput=e=>{S.name=e.target.value;$('#sum-name').textContent=S.name;$('#name-error').textContent=S.name.trim()?'1–64 个字符，名称可随时修改。':'请输入 1–64 字符的实例名称';$('#name-error').style.color=S.name.trim()?'':'var(--red)'};if($('#mod-search'))$('#mod-search').oninput=e=>{S.modFilter=e.target.value;let n=0;$$('[data-mod]').forEach(c=>{let yes=c.dataset.mod.includes(S.modFilter.toLowerCase());c.classList.toggle('hide',!yes);n+=yes});if($('#mod-empty'))$('#mod-empty').classList.toggle('hide',n>0)};if($('#memory'))$('#memory').oninput=e=>{$('#memory-val').textContent=e.target.value+' GiB';S.saved=false};if($('#log-search')){const f=()=>{$$('.logline').forEach(c=>c.classList.toggle('hide',!c.dataset.text.includes($('#log-search').value.toLowerCase())||($('#log-level').value==='warn'&&c.dataset.level==='INFO')))};$('#log-search').oninput=f;$('#log-level').onchange=f}$$('#settings-body input,#settings-body select').forEach(e=>e.addEventListener('change',()=>S.saved=false))}

function modal(title,body,footer){lastFocus=document.activeElement;$('#overlay').innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modalhead"><h2 id="modal-title">${title}</h2><button class="tool" aria-label="关闭对话框" onclick="closeModal()">${I('close')}</button></header><div class="modalbody">${body}</div><footer class="modalfoot">${footer||B('关闭','closeModal()')}</footer></section></div>`;$('.window').inert=true;$('.designbar').inert=true;$('#overlay button').focus()}
function closeModal(){const f=lastFocus;$('#overlay').innerHTML='';$('.window').inert=false;$('.designbar').inert=false;if(f&&document.contains(f))f.focus();else $('#main').focus()}
function confirmInstall(){if(!S.name.trim()){toast('请输入实例名称');$('#instance-name').focus();return}if(S.scene==='error'){modal('安装尚未开始',note('可用空间不足','至少需要释放 1.3 GiB 后才能提交。此时没有实例文件被修改。','bad'),B('返回调整','closeModal()','primary'));return}modal('确认安装计划',`<p class="muted">以下为固定计划的视觉示例，确认后进入模拟任务队列。</p><div class="kv"><span>目标实例</span><strong>${esc(S.name.trim())}</strong></div><div class="kv"><span>游戏 / Loader</span><span>${S.version} / ${S.loader}</span></div><div class="kv"><span>Java</span><span>${javaFor(S.version)} · 自动匹配</span></div><div class="kv"><span>新增下载 / 预留</span><span>668 MiB / 2.4 GiB（示例）</span></div><div class="kv"><span>数据处理</span><span>独立新实例，不覆盖其他存档</span></div><div class="notice" style="margin:18px 0 0">${I('check')}<span>下载→校验→安装→提交；所有步骤成功后才可启动。</span></div>`,B('返回修改','closeModal()')+B('加入模拟队列','addInstall()','primary','download'))}
function addInstall(){const id=Date.now();S.tasks.unshift({id,name:S.name.trim()+' · '+S.version,kind:'安装实例',state:S.scene==='offline'?'等待网络':'下载中',percent:0,meta:'0 MiB / 668 MiB',speed:'0 MiB/s',stage:'等待资源下载',error:false});S.taskTab='active';closeModal();go('tasks');toast('模拟安装任务已创建；未发起真实下载')}
function taskControl(id){let t=S.tasks.find(t=>t.id===id);if(S.scene==='error'&&id===1){S.scene='normal';$('#scenario').value='normal';t.error=false;t.state='下载中';toast('已模拟重试失败项；保留已验证资源')}else if(S.scene==='offline'){toast('当前演示为离线场景，请切换为“正常”后继续')}else{t.state=t.state==='下载中'?'已暂停':'下载中';toast(t.state==='已暂停'?'已模拟保存断点并暂停':'已模拟恢复任务')}render()}
function pauseAll(){S.tasks.forEach(t=>{if(t.state==='下载中')t.state='已暂停'});render();toast('活动下载已模拟暂停，断点已保存')}
function cancelTask(id){modal('取消这项任务？','<p>已验证缓存可以保留复用；尚未提交的实例变更将回滚。</p><p class="subtext">此处只演示状态转换，不删除文件。</p>',B('继续任务','closeModal()')+B('确认取消',`doCancel(${id})`,'danger'))}function doCancel(id){S.tasks.find(t=>t.id===id).state='已取消';closeModal();render();toast('已模拟安全取消')}
function taskDetails(id){let t=S.tasks.find(t=>t.id===id);modal('任务步骤与错误链',`<div class="kv"><span>任务</span><strong>${esc(t.name)}</strong></div><div class="kv"><span>1. 元数据与计划</span>${badge('已固定')}</div><div class="kv"><span>2. 获取资源</span>${badge(S.scene==='error'?'校验失败':t.state,S.scene==='error'?'bad':'')}</div><div class="kv"><span>3. 校验与构建</span>${badge(t.state==='已完成'?'已通过':'等待','neutral')}</div><div class="kv"><span>4. 提交实例</span>${badge(t.state==='已完成'?'已完成':'尚未开始','neutral')}</div>${S.scene==='error'?note('HASH_MISMATCH','示例文件 assets/objects/… 已隔离。旧实例完整；重试只获取失败对象。','bad'):note('状态与进度相互独立','字节达到 100% 后，仍需完成校验、构建与原子提交。')}`,B('关闭','closeModal()'))}
function completeTask(id){let t=S.tasks.find(t=>t.id===id);t.state='校验与安装';t.percent=100;render();modal('演示：校验与提交',`<div class="kv"><span>资源摘要审计</span>${badge('模拟通过')}</div><div class="kv"><span>Java 与组件构建</span>${badge('模拟通过')}</div><div class="kv"><span>实例文件与记录</span>${badge('等待提交','neutral')}</div><p class="subtext">这是设计审阅工具：模拟校验、构建和最终提交，不执行系统操作。</p>`,B('完成模拟提交',`finishTask(${id})`,'primary','check'))}function finishTask(id){let t=S.tasks.find(t=>t.id===id);t.state='已完成';t.meta='668 MiB / 668 MiB';S.completed=true;S.taskTab='done';closeModal();render();toast('模拟任务已完成，实例状态为就绪')}
function launch(n){chooseInstance(n);if(S.scene==='expired'||S.accountRemoved){modal('启动前需要重新登录',note(S.accountRemoved?'尚未添加账号':'当前账号已失效','实例与下载文件保留。重新验证后可继续启动。','warn'),B('稍后','closeModal()')+B('前往账号',"closeModal();go('accounts')",'primary'));return}if(S.scene==='error'){repairModal();return}if(S.scene==='offline'){modal('离线启动尚未验证',note('此设计演示不开放离线启动','仅先前验证账号可能具备离线资格；须在M3针对固定版本验证后开放。','warn'),B('返回','closeModal()'));return}if(S.running){modal(esc(S.instance)+'正在运行','<p>游戏进程由当前会话跟踪。结束游戏前，建议先在游戏内保存并退出。</p><p class="subtext">这里只更改演示状态，不管理真实进程。</p>',B('查看日志',"closeModal();go('logs')")+B('模拟正常退出','stopRun()','primary'));return}modal('启动预检 · '+esc(n),`<div class="kv"><span>游戏文件与资源</span>${badge('示例完整')}</div><div class="kv"><span>Java / 内存</span><span>${javaFor(S.instanceVersion)} / 4 GiB</span></div><div class="kv"><span>账号</span>${badge(S.scene==='offline'?'受限离线需验证':'已验证（模拟）',S.scene==='offline'?'warn':'')}</div>${note('这是交互演示','不会执行 Java、登录、下载或访问你的游戏文件。')}`,B('取消','closeModal()')+B('模拟启动','startRun()','primary','play'))}
function startRun(){S.running=true;closeModal();render();toast('模拟状态：游戏运行中，可查看日志')}function stopRun(){S.running=false;closeModal();render();toast('模拟游戏正常退出，退出码 0')}
function toggleMod(i){if(S.running){modal('游戏正在运行',note('暂时不能替换或启停 Mod','先在游戏内保存并退出，之后重新审查变更。','warn'),B('关闭','closeModal()'));return}modal('确认内容变更',`<div class="kv"><span>目标实例</span><strong>${esc(S.instance)}</strong></div><div class="kv"><span>${esc(S.mods[i].name)}</span><span>${S.mods[i].enabled?'禁用':'启用'}</span></div>${note('依赖检查后提交','此示例没有受影响的必需依赖；正式实现若有依赖冲突将阻止确认。')}`,B('取消','closeModal()')+B('确认模拟变更',`applyToggle(${i})`,'primary'))}

function discoverDetail(n){if(S.scene==='offline'){toast('当前离线：可以查看缓存，但新安装需等待网络')}modal(esc(n)+' · 安装预览',`<div class="row"><div class="modletter">${esc(n[0])}</div><div><h3>${esc(n)}</h3><p class="subtext">来源 Modrinth · 项目与版本待固定</p></div></div><div class="kv"><span>目标实例</span><strong>${esc(S.instance)} · ${S.instanceVersion} / ${S.instanceLoader}</strong></div><div class="kv"><span>候选文件</span><span>客户端兼容版本（演示）</span></div><h3 style="margin-top:18px">依赖计划</h3><div class="checks"><input type="checkbox" checked disabled> Fabric API · 必需依赖（示例已安装）</div><label class="checks"><input type="checkbox"> 可选建议依赖（默认不安装）</label><p class="subtext">依赖类型与候选仅为交互示例。真实产品必须递归求解后锁定全部 version ID 与 hash。</p>`,B('取消','closeModal()')+B('加入模拟队列',`queueMod('${esc(n)}')`,'primary','download'))}

function saveSettings(){let c=$('#concurrency');if(c&&(!c.value||+c.value<1||+c.value>16||!Number.isInteger(+c.value))){toast('全局并发必须为 1–16 的整数');c.focus();return}captureSettings();if(!Number.isInteger(S.prefs.concurrency)||S.prefs.concurrency<1||S.prefs.concurrency>16){toast('全局并发必须为1–16的整数');return false}if(!Number.isInteger(S.prefs.perHost)||S.prefs.perHost<1||S.prefs.perHost>8||S.prefs.perHost>S.prefs.concurrency){toast('单域并发须为1–8，且不超过全局');return}if(!Number.isFinite(S.prefs.limit)||S.prefs.limit<0||S.prefs.limit>1024||!Number.isInteger(S.prefs.limit)){toast('限速必须为0–1024的整数');return}S.savedPrefs={...S.prefs};S.savedDark=document.body.classList.contains('dark');S.saved=true;render();toast('设置已在演示会话中保存；没有写入系统配置');return true}

function deleteModal(){modal('移至回收站？',note('此实例含 3 个存档','默认包含 saves 目录；保留 7 天后才可永久清理。共享缓存不随实例删除。','warn')+`<div class="kv"><span>实例</span><strong>${esc(S.instance)}</strong></div><p class="subtext">原型仅展示删除结果，不会删除真实目录。</p>`,B('取消','closeModal()')+B('模拟移至回收站',S.running?"toast('游戏运行中，请先退出')":"closeModal();S.scene='empty';$('#scenario').value='empty';go('instances');toast('模拟已移至回收站，可在真实产品中恢复')",'danger'))}
function instanceParams(){modal('实例启动参数',`<div class="kv"><span>Java策略</span><span>继承全局 · 自动匹配</span></div><div class="kv"><span>最大内存</span><span>实例覆盖 · 4096 MiB</span></div><div class="kv"><span>窗口</span><span>1280 × 720</span></div>${note('敏感参数仅在 Rust 内填充','认证、classpath、主类与工作目录不由任意前端字符串覆盖。')}`,B('关闭','closeModal()')+B('查看全局配置',"closeModal();S.settingsTab='java';go('settings')",'primary'))}
function localModModal(){if(S.instanceLoader!=='Fabric'){toast('此原型只为远山生存提供本地Mod预览，请先选择该实例');return}modal('添加本地 Mod',`<p>真实产品会通过系统选择器接收 JAR，再读取有限大小的元数据与摘要。</p>${note('不执行 JAR 进行识别','未知来源与无法识别的 Mod 保留为“未知”，安装前核对目标实例与依赖。')}`,B('关闭','closeModal()')+B('演示未知文件预览',"modal('本地 Mod 预览',note('来源未知','example.jar · 兼容条件未声明；不能保证运行时兼容。','warn'),B('取消','closeModal()')+B('模拟添加',\"queueMod('本地 example.jar')\",'primary'))",'primary'))}
function cleanupModal(){modal('缓存清理预览',`<div class="kv"><span>预计可释放</span><strong>820 MiB（演示）</strong></div><div class="kv"><span>范围</span><span>无实例、任务或备份引用的对象</span></div>${note('先审计引用，再隔离候选','saves、config、活动任务与回收记录不会参与此项清理。')}`,B('取消','closeModal()')+B('模拟清理',"closeModal();toast('已模拟清理无引用缓存；实际磁盘未改变')",'primary'))}
function migrateModal(){modal('迁移数据目录',note('复制校验后才切换目录','需要关闭游戏并暂停写入任务；旧目录保留回退期。','warn')+`<div class="kv"><span>当前</span><span class="mono">D:\\Games\\KLauncher</span></div><div class="kv"><span>新目录</span><span>由系统选择器授权（此处不执行）</span></div><p class="subtext">跨卷移动不具有原子性，真实实现必须复制→校验→切换指针。</p>`,B('关闭','closeModal()'))}
function exportLogs(){modal('脱敏导出预览',`<p class="muted">仅生成本地报告，需由你决定是否分享。</p><div class="checks"><input type="checkbox" checked disabled> 认证 token / Cookie / 授权码始终隐藏</div><label class="checks"><input type="checkbox" checked> 隐藏邮箱、用户目录、UUID与IP</label><label class="checks"><input type="checkbox" checked> 包含环境摘要与错误链</label><div class="logwindow" style="min-height:120px;margin-top:18px">[ACCOUNT] · access_token=[REDACTED]<br>路径：[USER_HOME]/Games/…<br>服务器：[SERVER]<br>诊断：${S.scene==='error'?'Java版本不兼容':'无确定错误'}</div><p class="subtext">请额外检查聊天和自定义日志。自动规则不保证识别全部私人内容。</p>`,B('取消','closeModal()')+B('模拟本地导出',"closeModal();toast('导出流程演示完成；没有读取或写出真实日志')",'primary','download'))}
function openSearch(){modal('快速前往',`<label class="label" for="quick-search">搜索页面或操作</label><input class="input" id="quick-search" placeholder="例如：安装、任务、设置" oninput="filterQuick(this.value)"><div id="quick-links" style="margin-top:16px">${Object.entries(names).map(([r,n])=>`<a href="#${r}" class="listrow" onclick="closeModal()" data-quick="${n}">${I(r==='home'?'home':r==='instances'?'grid':r==='instance'?'cube':r==='install'?'download':r==='tasks'?'task':r==='accounts'?'user':r==='settings'?'settings':r==='logs'?'log':'cube')}<span>${n}</span><span class="muted" style="margin-left:auto">↵</span></a>`).join('')}</div>`);$('#quick-search').focus()}function filterQuick(v){$$('[data-quick]').forEach(e=>e.classList.toggle('hide',!e.dataset.quick.includes(v)))}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a&&names[a.getAttribute('href').slice(1)]){e.preventDefault();go(a.getAttribute('href').slice(1))}});
$('#scenario').onchange=e=>{S.scene=e.target.value;render()};$('#reset').onclick=()=>location.reload();window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'&&$('#overlay').children.length)closeModal();if(e.key==='Tab'&&$('#overlay').children.length){let es=$$('#overlay button:not(:disabled),#overlay a,#overlay input:not(:disabled),#overlay select');let first=es[0],last=es[es.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
</script></body></html>
